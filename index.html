<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Family Travel</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Family Travel"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg:#f5f5f5;--white:#fff;--text:#111;--muted:#888;
  --border:#e5e5e5;--card:#efefef;--pill:#3a3a3a;--pt:#fff;
  --red:#e84040;--green:#22c55e;--r:14px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:var(--font);background:var(--bg);color:var(--text);height:100%;overflow:hidden}
input,select,textarea,button{font-family:var(--font)}
#app{max-width:480px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.hdr{background:var(--white);padding:12px 16px 0;flex-shrink:0;box-shadow:0 1px 0 var(--border);z-index:10}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hdr-title{font-size:21px;font-weight:600}
.hdr-acts{display:flex;align-items:center;gap:7px}
.btn-ic{background:var(--card);border:none;border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;color:var(--text)}
.btn-ic:active{opacity:.6}
.btn-rnd{background:var(--pill);color:var(--pt);border:none;border-radius:99px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-rnd:active{opacity:.7}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.sync span{width:7px;height:7px;border-radius:50%;display:inline-block}
.sbar{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:11px;padding:9px 13px;margin-bottom:2px}
.sbar input{background:none;border:none;outline:none;font-size:15px;color:var(--text);flex:1}
.pp{padding:7px 0 3px}
.pp-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.pp-bar{background:var(--border);border-radius:99px;height:5px;overflow:hidden}
.pp-fill{background:var(--pill);height:100%;border-radius:99px;transition:width .4f}
.owf{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.owf::-webkit-scrollbar{display:none}
.owp{background:var(--card);border:1.5px solid transparent;border-radius:99px;padding:5px 13px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0}
.owp.on{background:var(--pill);color:var(--pt);border-color:var(--pill)}
.tabs{display:flex;margin-top:6px}
.tab{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 11px;border-bottom:2px solid transparent;color:var(--muted);font-size:10px;font-weight:400;transition:color .15s,border-color .15s}
.tab.on{color:var(--text);border-bottom-color:var(--text);font-weight:700}
.body{flex:1;overflow-y:auto;padding:14px 14px 30px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dc{background:var(--card);border-radius:var(--r);padding:13px;cursor:pointer;position:relative}
.dc:active{opacity:.7}
.dc-day{font-size:15px;font-weight:600;padding-right:44px;line-height:1.3;color:#0047AB}
.dc-date{font-size:12px;color:var(--muted);margin-top:2px}
.dc-place{font-size:12px;color:var(--text);margin-top:6px;font-weight:500;line-height:1.4}
.acts{position:absolute;top:8px;right:8px;display:flex;gap:3px}
.acts button{background:rgba(0,0,0,.07);border:none;border-radius:6px;padding:3px 6px;cursor:pointer;line-height:1}
.acts button:active{opacity:.6}
.lc{background:var(--white);border-radius:var(--r);padding:13px 15px;margin-bottom:9px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;position:relative}
.lc:active{opacity:.8}
.lc-t{font-size:15px;font-weight:600;padding-right:60px}
.lc-s{font-size:12px;color:var(--muted);margin-top:3px}
.lc-n{font-size:12px;color:var(--text);margin-top:5px;line-height:1.4}
.pi{background:var(--white);border-radius:var(--r);padding:11px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;align-items:center;gap:11px}
.pck{background:none;border:none;cursor:pointer;line-height:1;padding:0;flex-shrink:0}
.pi-lbl{font-size:14px;font-weight:600}
.pi-lbl.done{text-decoration:line-through;color:var(--muted)}
.pi-sub{font-size:12px;color:var(--muted);margin-top:2px}
.st{text-align:center;padding-top:60px;color:var(--muted)}
.st .ic{margin-bottom:12px}
.st p{font-size:14px;line-height:1.6}
.err-msg{font-size:13px;color:var(--red);margin-top:8px}
.btn-retry{background:var(--pill);color:var(--pt);border:none;border-radius:10px;padding:10px 22px;font-size:14px;cursor:pointer;margin-top:12px}
#det{display:none;position:fixed;inset:0;background:var(--white);z-index:50;overflow-y:auto;max-width:480px;margin:0 auto;-webkit-overflow-scrolling:touch}
#det.on{display:block}
.det-in{padding:16px 20px 50px}
.back{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;color:var(--text);font-size:15px;padding:0;margin-bottom:20px}
.back:active{opacity:.6}
.det-hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.det-ttl{font-size:25px;font-weight:700;line-height:1.25}
.det-sub{font-size:14px;color:var(--muted);margin-top:5px}
.btn-edit{background:var(--pill);color:var(--pt);border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;flex-shrink:0}
.det-rows{margin-top:22px}
.dr{display:flex;border-bottom:1px solid var(--border);padding:13px 0;gap:14px;align-items:flex-start}
.dr .l{font-size:14px;color:var(--muted);width:130px;flex-shrink:0}
.dr .v{font-size:14px;color:var(--text);flex:1;line-height:1.6;text-align:left;white-space:pre-wrap;word-break:break-word}
#frm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end;justify-content:center}
#frm.on{display:flex}
.fs{background:var(--white);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column}
.fh{display:flex;justify-content:center;padding:12px 0 4px}
.fh span{width:36px;height:4px;border-radius:99px;background:var(--border)}
.fhdr{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 14px}
.fhdr-t{font-size:17px;font-weight:700}
.fcls{background:var(--card);border:none;border-radius:99px;width:30px;height:30px;cursor:pointer;font-size:16px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.fb{overflow-y:auto;padding:0 20px;flex:1}
.ff{margin-bottom:14px}
.fl{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.7px;text-transform:uppercase;display:block;margin-bottom:5px}
.fi{width:100%;background:#f0f0f0;border:1px solid #e0e0e0;border-radius:10px;padding:11px 13px;font-size:15px;color:var(--text);outline:none}
.fi:focus{border-color:#bbb}
textarea.fi{resize:vertical;line-height:1.5;min-height:80px}
select.fi{appearance:none}
.fck{display:flex;align-items:center;gap:12px;cursor:pointer;margin-top:4px}
.fck input{width:22px;height:22px;accent-color:var(--pill);cursor:pointer}
.fft{padding:14px 20px 36px}
.fsave{width:100%;padding:14px;background:var(--pill);color:var(--pt);border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer}
.fsave:active{opacity:.8}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--pill);color:var(--pt);border-radius:99px;padding:10px 22px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:200;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#stt{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;align-items:flex-end;justify-content:center}
#stt.on{display:flex}
.stp{background:var(--white);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column}
.stb{overflow-y:auto;padding:0 20px;flex:1}
.st-sec{margin-bottom:22px}
.st-sec-t{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block}
.st-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.st-row input{flex:1;background:#f0f0f0;border:1px solid #e0e0e0;border-radius:10px;padding:9px 12px;font-size:14px;color:var(--text);outline:none;font-family:var(--font)}
.st-row input:focus{border-color:#bbb}
.st-del{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;line-height:1;border-radius:6px}
.st-del:active{opacity:.6}
.st-add{background:var(--card);border:none;border-radius:10px;padding:9px 14px;font-size:13px;color:var(--text);cursor:pointer;font-family:var(--font);margin-top:2px}
.st-add:active{opacity:.7}
.op50{opacity:.5}
.sec-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 2px 6px}

/* ── Trip Selector ── */
#trip-sel{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;max-width:480px;margin:0 auto}
#trip-sel.on{display:block}
.ts-wrap{padding:24px 20px 50px}
.ts-hdr{font-size:26px;font-weight:700;margin-bottom:4px}
.ts-sub{font-size:14px;color:var(--muted);margin-bottom:24px}
.ts-card{background:var(--white);border-radius:16px;padding:18px 18px;margin-bottom:12px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;align-items:center;gap:14px;border:2px solid transparent;transition:border-color .15s}
.ts-card:active{opacity:.7}
.ts-card.active-trip{border-color:var(--pill)}
.ts-card-ico{width:44px;height:44px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ts-card-body{flex:1;min-width:0}
.ts-card-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-card-dates{font-size:12px;color:var(--muted);margin-top:2px}
.ts-card-badge{font-size:11px;font-weight:700;background:var(--pill);color:var(--pt);border-radius:99px;padding:3px 9px;flex-shrink:0}
.ts-add{width:100%;padding:14px;background:var(--card);color:var(--text);border:2px dashed var(--border);border-radius:16px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
.ts-add:active{opacity:.7}

/* Trip indicator pill in header */
.trip-pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:99px;padding:5px 11px 5px 8px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text);border:none;max-width:160px;overflow:hidden}
.trip-pill:active{opacity:.7}
.trip-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Import Modal ── */
#import-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;align-items:flex-end;justify-content:center}
#import-modal.on{display:flex}
.im-sheet{background:var(--white);border-radius:22px 22px 0 0;padding:24px 22px 40px;width:100%;max-width:480px}
.im-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 18px}
.im-title{font-size:16px;font-weight:700;margin-bottom:6px}
.im-sub{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.im-cols{list-style:none;margin-bottom:22px}
.im-cols li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.im-cols li:last-child{border-bottom:none}
.im-col-dot{width:7px;height:7px;border-radius:50%;background:var(--pill);flex-shrink:0}
.im-col-name{font-weight:600;min-width:120px}
.im-col-desc{color:var(--muted);font-size:12px}
.im-btns{display:flex;gap:10px}
.im-btn-cancel{flex:1;padding:13px;background:var(--card);border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;color:var(--text)}
.im-btn-go{flex:2;padding:13px;background:var(--pill);color:var(--pt);border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.im-btn-cancel:active,.im-btn-go:active{opacity:.7}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-top">
      <div style="display:flex;flex-direction:column;gap:3px">
        <div class="hdr-title" id="hdr-t">Itinerary</div>
        <button class="trip-pill" id="trip-pill-btn" onclick="openTripSelector()" style="display:none">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="trip-pill-name">Select trip</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
      <div class="hdr-acts">
        <div class="sync"><span id="sdot" style="background:#ccc"></span><span id="slbl">Loading…</span></div>
        <button class="btn-ic" onclick="loadTab()" title="Refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <button class="btn-ic" onclick="triggerImport()" title="Import Excel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <input type="file" id="fi" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleImport(event)"/>
        <button class="btn-ic" id="settbtn" onclick="openSettings()" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="btn-rnd" onclick="openAdd()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>
    <div class="sbar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="si" placeholder="Search" oninput="render()"/>
    </div>
    <div id="pp" class="pp" style="display:none">
      <div class="pp-row"><span>Packed</span><span id="pc">0/0</span></div>
      <div class="pp-bar"><div class="pp-fill" id="pf" style="width:0%"></div></div>
    </div>
    <div class="tabs">
      <button class="tab" id="tp" onclick="switchTab('packing_list')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Packing
      </button>
      <button class="tab" id="ta" onclick="switchTab('stay')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9v11"/><path d="M21 9v11"/><path d="M3 13h18"/><path d="M3 9a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4"/><path d="M9 13v-2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        Stays
      </button>
      <button class="tab on" id="ti" onclick="switchTab('itinerary')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Itinerary
      </button>
      <button class="tab" id="tsh" onclick="switchTab('shopping_list')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Shopping
      </button>
    </div>
  </div>

  <div class="body" id="body">
    <div class="st"><div class="ic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg></div><p>Loading…</p></div>
  </div>

  <div id="det">
    <div class="det-in">
      <button class="back" onclick="closeDet()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>Back
      </button>
      <div class="det-hdr">
        <div><div class="det-ttl" id="dt"></div><div class="det-sub" id="ds"></div></div>
        <button class="btn-edit" onclick="editFromDet()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Edit
        </button>
      </div>
      <div class="det-rows" id="dr"></div>
    </div>
  </div>

  <div id="frm" onclick="bgClose(event)">
    <div class="fs">
      <div class="fh"><span></span></div>
      <div class="fhdr"><div class="fhdr-t" id="ft"></div><button class="fcls" onclick="closeForm()">✕</button></div>
      <div class="fb" id="fb"></div>
      <div class="fft"><button class="fsave" onclick="submitForm()">Save</button></div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Trip Selector -->
  <div id="trip-sel">
    <div class="ts-wrap">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div class="ts-hdr" style="margin-bottom:0">Happy Holidays</div>
        <button onclick="openSettings()" style="background:none;border:none;padding:6px;cursor:pointer;color:var(--muted)" title="Settings">

<script>
// ── Supabase ──────────────────────────────────────────────────────────────────
const SB_URL = 'https://fpzrivavbtentaqbvpuj.supabase.co';

const H = {
  'Content-Type':  'application/json',
  'apikey':        SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Prefer':        'return=representation'
};

async function sbGet(table, order, tripId) {
  let url = `${SB_URL}/rest/v1/${table}?select=*&order=${order}`;
  // Fetch rows for this trip OR rows with no trip assigned (legacy data)
  if (tripId) url += `&or=(trip_id.eq.${tripId},trip_id.is.null)`;
  const r = await fetch(url, { headers: H });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// Bulk-assign unlinked rows to a trip
async function sbAssignTripId(table, tripId) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?trip_id=is.null`, {
    method: 'PATCH', headers: H, body: JSON.stringify({ trip_id: tripId })
  });
  if (!r.ok) throw new Error(await r.text());
}
async function sbGetTrips() {
  const r = await fetch(`${SB_URL}/rest/v1/trips?select=*&order=created_at.desc`, { headers: H });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbInsert(table, body) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, { method:'POST', headers: H, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbUpdate(table, id, body) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, { method:'PATCH', headers: H, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(table, id) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, { method:'DELETE', headers: { ...H, Prefer:'return=minimal' } });
  if (!r.ok) throw new Error(await r.text());
}
async function sbGetWhere(table, query) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?select=*&${query}`, { headers: H });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

let rows = [];

// ── Sync indicator ────────────────────────────────────────────────────────────
function ss(s) {
  const dot = document.getElementById('sdot'), lbl = document.getElementById('slbl');
  const colors = { ok:'var(--green)', saving:'#f59e0b', error:'var(--red)', loading:'#ccc' };
  const labels = { ok:'Live', saving:'Saving…', error:'Error', loading:'Loading…' };
  dot.style.background = colors[s] || '#ccc';
  lbl.textContent = labels[s] || '…';
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function loadTab() {
  if (!CURRENT_TRIP_ID) { openTripSelector(); return; }
  ss('loading');
  document.getElementById('si').value = '';

  const cacheKey = `cache_${CT}_${CURRENT_TRIP_ID}`;
  const cached = localStorage.getItem(cacheKey);
  if (cached) {
    try { rows = JSON.parse(cached); ss('ok'); render(); } catch(_) {}
  }

  try {
    const cfg = TAB_CFG[CT];
    const fetched = await sbGet(cfg.table, cfg.order, CURRENT_TRIP_ID);
    rows = fetched || [];
    try { localStorage.setItem(cacheKey, JSON.stringify(rows)); } catch(_) {}
    ss('ok');
    render();
  } catch(e) {
    if (!cached) {
      rows = [];
      ss('error');
      document.getElementById('body').innerHTML = `
        <div class="st">
          <div class="ic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
          <p>Could not load data</p>
          <button class="btn-retry" onclick="loadTab()">Try Again</button>
        </div>`;
    }
  }
}

function switchTab(t) {
  if (!TAB_CFG[t] || !TAB_IDS[t]) return;
  CT = t;
  OWNER_FILTER = 'Show All';
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
  document.getElementById(TAB_IDS[t]).classList.add('on');
  document.getElementById('hdr-t').textContent = TAB_LABELS[t];
  // Settings button always visible (contains global admin passcode)
  loadTab();
}

  const owners = ['Show All', ...getOwners()];

  ).join('')}</div>`;
}
function setOwnerFilter(o) {
  OWNER_FILTER = o;
  renderOwnerPills();
  render();
}

  const unlinked = rows.filter(r => !r.trip_id);
  if (!unlinked.length || !CURRENT_TRIP_ID) return '';
  return `<div style="background:#fffbe6;border:1px solid #f59e0b;border-radius:12px;padding:11px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">

}

  ss('saving');
  try {
    const tables = ['itinerary','stay','packing_list','transport','shopping_list'];

    toast('All items linked to this trip');
    await loadTab();
  } catch(e) { ss('error'); toast('Error: ' + e.message); }
}

    const done = rows.filter(x => x.is_packed).length;
    document.getElementById('pc').textContent = `${done} / ${rows.length}`;
    document.getElementById('pf').style.width = `${(done/rows.length)*100}%`;
    pp.style.display = 'block';
  } else { pp.style.display = 'none'; }

  if      (CT === 'itinerary')      renderItin(el, q);
  else if (CT === 'stay')           renderStay(el, q);
  else if (CT === 'packing_list')   renderPack(el, q);
  else if (CT === 'shopping_list')  renderShop(el, q);
  else                              renderTrans(el, q);

async function uploadShopImage(file) {
  const ext  = file.name.split('.').pop();
  const path = `shopping/${Date.now()}.${ext}`;
  const r    = await fetch(`${SB_URL}/storage/v1/object/shopping-images/${path}`, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': file.type },
    body: file,
  });
  if (!r.ok) throw new Error('Image upload failed');
  return `${SB_URL}/storage/v1/object/public/shopping-images/${path}`;
}

async function submitForm() {
  if (FORM_MODE === 'trip') { await submitTripForm(); return; }
  const payload = {};
  FIELDS[CT].forEach(f => {
    if (f.t === 'price') {
      const numEl = document.getElementById('ff' + f.k);
      const selEl = document.getElementById('ff' + f.cur + '_sel');
      const txtEl = document.getElementById('ff' + f.cur);
      payload[f.k]   = numEl && numEl.value !== '' ? Number(numEl.value) : null;
      payload[f.cur] = selEl ? (selEl.value === 'Other' ? (txtEl ? txtEl.value.trim() || null : null) : selEl.value || null) : null;
      return;
    }
    if (f.t === 'cur') {
      const sel = document.getElementById('ff' + f.k + '_sel');
      const txt = document.getElementById('ff' + f.k);
      if (sel) payload[f.k] = sel.value === 'Other' ? (txt ? txt.value.trim() || null : null) : (sel.value || null);
      return;
    }
    const el = document.getElementById('ff' + f.k); if (!el) return;
    payload[f.k] = f.t === 'chk'    ? el.checked
                 : f.t === 'number' ? (el.value !== '' ? Number(el.value) : null)
                 : el.value || null;
  });
  // Attach current trip to new items
  if (!FI && CURRENT_TRIP_ID) payload.trip_id = CURRENT_TRIP_ID;

  // Handle image upload for shopping list
  if (CT === 'shopping_list') {
    const imgUrlEl = document.getElementById('ff_img_url');
    const imgFileEl = document.getElementById('ff_img_file');
    if (imgUrlEl && imgUrlEl.value === '__pending__' && imgFileEl && imgFileEl.files[0]) {
      try {
        payload.image_url = await uploadShopImage(imgFileEl.files[0]);
      } catch(imgErr) { toast('Image upload failed — item saved without image'); }
    } else if (imgUrlEl) {
      payload.image_url = imgUrlEl.value || null;
    }
  }

  const editId = FI ? FI.id : null;
  closeForm();
  ss('saving');

  try {
    // ── Everyone expansion for packing list ──────────────────────────────────
    // If adding (not editing) a packing item for "Everyone", create one row
    // per individual traveller (owners excluding Everyone & Shared)
    if (!editId && CT === 'packing_list' && payload.owner === 'Everyone') {
      const allOwners = getOwners().filter(o => o !== 'Everyone' && o !== 'Shared');
      if (allOwners.length) {
        const inserted = [];
        for (const owner of allOwners) {
          const result = await sbInsert('packing_list', { ...payload, owner, is_packed: false });
          if (result[0]) inserted.push(result[0]);
        }
        rows.push(...inserted);
        localStorage.setItem(`cache_${CT}_${CURRENT_TRIP_ID}`, JSON.stringify(rows));
        render();
        toast(`Added for ${allOwners.join(', ')}`);
        ss('ok');
        return;
      }
    }
    // ────────────────────────────────────────────────────────────────────────

    let updatedItem;
    if (editId) {
      const result = await sbUpdate(TAB_CFG[CT].table, editId, payload);
      updatedItem = result[0];
      toast('Saved');
    } else {
      const result = await sbInsert(TAB_CFG[CT].table, payload);
      updatedItem = result[0];
      toast('Added');
    }

    // 1. Optimistic Update: Refresh memory rows immediately
    if (editId) {
      rows = rows.map(r => r.id === editId ? updatedItem : r);
    } else {
      rows.push(updatedItem);
    }

    // 2. Refresh the UI (List and potentially Detail)
    render();
    if (editId && DI && DI.id === editId) {
      openDet(editId); // Refresh the labels in the detail view
    }

    // 3. Update persistent cache
    localStorage.setItem(`cache_${CT}_${CURRENT_TRIP_ID}`, JSON.stringify(rows));
    ss('ok');

  } catch(e) {
    ss('error');
    toast('Error: ' + e.message);
    // Fallback reload if something went wrong
    await loadTab();
  }
}

      ? `<div style="font-size:12px;color:var(--muted);margin-top:3px">${homePrice?'🏠 '+homePrice:''}${localPrice?' · '+localPrice:''}${convertedPrice?' → '+convertedPrice:''}</div>` : '';
    const subLine = [r.who_for, r.where_to_buy].filter(Boolean).join(' · ');
    return `<div class="card${r.is_purchased?' op50':''}" onclick="openDet(${r.id})">

function handleImport(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(ev) {
    try {
      const wb = XLSX.read(ev.target.result, { type:'binary' });
      let total = 0;
      toast('Importing…');
      for (const sn of wb.SheetNames) {
        const sheetRows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval:'' });
        if (!sheetRows.length) continue;
        const snl = sn.toLowerCase();
        let inserts = [];

        if (snl.includes('transport') || snl.includes('flight')) {
          inserts = sheetRows.map(r => ({
            trip_id:   CURRENT_TRIP_ID || null,
            flight_no: r['Flight No']||r['Ref']||r['flight_no']||'',
            dep_city:  r['From']||r['dep_city']||'',
            arr_city:  r['To']||r['arr_city']||'',
            dep_time:  r['Departure']||r['Departs']||r['dep_time']||'',
            notes:     r['Notes']||r['notes']||'',
          }));
          for (const row of inserts) { await sbInsert('transport', row); total++; }
        } else if (snl.includes('pack')) {
          inserts = sheetRows.map(r => ({
            trip_id:   CURRENT_TRIP_ID || null,
            notes:     r['Item']||r['item']||r['notes']||'',
            category:  r['Category']||r['category']||'',
            owner:     r['Who']||r['Owner']||r['owner']||'',
            quantity:  r['Quantity']||r['qty']||'',
            is_packed: false,
          }));
          for (const row of inserts) { await sbInsert('packing_list', row); total++; }
        } else if (snl.includes('stay') || snl.includes('hotel') || snl.includes('address')) {
          inserts = sheetRows.map(r => ({
            trip_id:         CURRENT_TRIP_ID || null,
            hotel_name:      r['Destination']||r['Hotel']||r['Name']||r['hotel_name']||'',
            check_in_date:   r['Check-in']||r['Check In']||r['check_in_date']||'',
            check_out_date:  r['Check-out']||r['Check Out']||r['check_out_date']||'',
            address:         r['Chinese Address (Show this to Driver)']||r['Address']||r['address']||'',
            confirmation_no: r['Ref']||r['Confirmation']||r['confirmation_no']||'',
            notes:           r['Notes']||r['notes']||'',
          }));
          for (const row of inserts) { await sbInsert('stay', row); total++; }
        } else {
          // Check existing itinerary rows for this trip to avoid duplicates
          let existingDays = new Set();
          try {
            const existing = await sbGetWhere('itinerary', `trip_id=eq.${CURRENT_TRIP_ID}&select=day_number`);
            existing.forEach(r => existingDays.add(r.day_number));
          } catch(_) {}
          inserts = sheetRows.map(r => ({
            trip_id:       CURRENT_TRIP_ID || null,
            day_number:    parseInt(String(r['Day']||r['day_number']||'').replace(/\D/g,''))||null,
            date_label:    r['Date']||r['date_label']||'',
            place_area:    r['Place/Area']||r['Place']||r['place_area']||'',
            activities:    r['Activities']||r['activities']||'',
            opening_hours: r['Opening Hours']||r['opening_hours']||'',
            best_time:     r['Best Time']||r['best_time']||'',
            commute:       r['Commute']||r['commute']||'',
            notes:         r['Notes']||r['notes']||'',
          })).filter(r => r.day_number && !existingDays.has(r.day_number));
          for (const row of inserts) { await sbInsert('itinerary', row); total++ ; }
        }
      }
      await loadTab();
      toast(`Imported ${total} row${total !== 1 ? 's' : ''}`);
    } catch(err) { ss('error'); toast('Import error: ' + err.message); }
  };
  reader.readAsBinaryString(file);
  e.target.value = '';
}

let PENDING_UNLOCK_ID = null;

      ? `<span class="ts-card-badge" style="background:#888">Archived</span>`

    const clickFn = isLocked ? `promptTripUnlock(${i})` : `selectTripByIndex(${i})`;
    return `

        ${dates ? `<div class="ts-card-dates">${esc(dates)}</div>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        ${statusBadge}
        <button class="btn-ic" style="padding:5px 8px;flex-shrink:0" onclick="event.stopPropagation();openEditTripByIndex(${i})" title="Edit trip">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-ic" style="padding:5px 8px;flex-shrink:0;color:var(--red)" onclick="event.stopPropagation();deleteTripByIndex(${i})" title="Delete trip">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');
}

function promptTripUnlock(i) {
  const t = allTrips[i]; if (!t) return;
  PENDING_UNLOCK_ID = t.id;
  document.getElementById('passcode-entry').value = '';
  document.getElementById('passcode-error').style.display = 'none';
  document.getElementById('passcode-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('passcode-entry').focus(), 100);
}
function closePasscodeModal() {
  document.getElementById('passcode-modal').style.display = 'none';
  PENDING_UNLOCK_ID = null;
}
function bgClosePasscodeModal(e) {
  if (e.target === document.getElementById('passcode-modal')) closePasscodeModal();
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('passcode-modal') && document.getElementById('passcode-modal').style.display === 'flex') submitPasscode();
});
function submitPasscode() {
  if (!PENDING_UNLOCK_ID) return;
  const trip    = allTrips.find(t => t.id === PENDING_UNLOCK_ID);
  const entered = document.getElementById('passcode-entry').value;
  if (trip && entered === trip.passcode) {
    setTripUnlocked(PENDING_UNLOCK_ID);
    closePasscodeModal();
    toast('Trip unlocked');
    renderTripList();
    // Auto-select the trip after unlocking
    selectTrip(trip.id, trip.name);
  } else {
    document.getElementById('passcode-error').style.display = 'block';
    document.getElementById('passcode-entry').value = '';
    document.getElementById('passcode-entry').focus();
  }
}

function selectTripByIndex(i) {
  const t = allTrips[i]; if (!t) return;
  selectTrip(t.id, t.name);
}
function openEditTripByIndex(i) {
  const t = allTrips[i]; if (!t) return;
  openEditTrip(t.id);
}
async function deleteTripByIndex(i) {
  const t = allTrips[i]; if (!t) return;
  if (!confirm('Delete "' + t.name + '"? Itinerary and packing data will not be deleted.')) return;
  ss('saving');
  try {
    const r = await fetch(SB_URL + '/rest/v1/trips?id=eq.' + t.id, { method: 'DELETE', headers: H });
    if (!r.ok) throw new Error(await r.text());
    allTrips = allTrips.filter(x => x.id !== t.id);
    if (CURRENT_TRIP_ID === t.id) {
      CURRENT_TRIP_ID = null;
      localStorage.removeItem('currentTripId');
      document.getElementById('trip-pill-btn').style.display = 'none';
    }
    toast('Trip deleted');
    ss('ok');
    renderTripList();
  } catch(e) { ss('error'); toast('Error: ' + e.message); }
}

function selectTrip(id, name) {
  CURRENT_TRIP_ID = id;
  localStorage.setItem('currentTripId', id);
  document.getElementById('trip-sel').classList.remove('on');

function buildTripMetaForm(t) {
  const v = k => esc(t ? (t[k] ?? '') : '');
  const hasPasscode = t && t.passcode;
  return `
    <div class="ff"><label class="fl">Trip Name</label><input class="fi" id="tfname" value="${v('name')}" placeholder="e.g. Japan 2025"/></div>

function bgCloseTripFrm(e) { if (e.target === document.getElementById('trip-frm')) closeTripFrm(); }
async function submitTripMeta(andOpen = false) {
  const name = document.getElementById('tfname').value.trim();
  if (!name) { toast('Trip name is required'); return; }
  const passcode = document.getElementById('tfpasscode').value.trim();
  const payload = {
    name,
    start_date: document.getElementById('tfstart').value || null,
    end_date:   document.getElementById('tfend').value || null,
    status:     document.getElementById('tfstatus').value,
    passcode:   passcode || null,
    is_private: !!passcode,
  };
  // Capture edit target BEFORE closing the form (closeTripFrm nulls TRIP_META_EDIT)
  const editTarget = TRIP_META_EDIT;
  closeTripFrm();
  ss('saving');
  try {
    if (editTarget) {
      await sbUpdate('trips', editTarget.id, payload);
      toast('Trip updated');
      if (editTarget.id === CURRENT_TRIP_ID) {
        document.getElementById('trip-pill-name').textContent = payload.name;
      }
      if (andOpen) { selectTrip(editTarget.id, payload.name); return; }
    } else {
      const res = await sbInsert('trips', payload);
      const newTrip = res[0];
      toast('Trip created');
      selectTrip(newTrip.id, newTrip.name);
      return;
    }
    allTrips = await sbGetTrips();
    renderTripList();
    ss('ok');
  } catch(e) { ss('error'); toast('Error: ' + e.message); }
}

  const div = document.createElement('div');
  div.className = 'st-row';
  div.innerHTML = `<input type="text" id="own${i}" value="" placeholder="Name…"/><button class="st-del" onclick="this.parentElement.remove()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
  list.appendChild(div);
}
function removeOwner(i) {
  const el = document.getElementById('own' + i);
  if (el) el.closest('.st-row').remove();
}
function addCat() {
  const list = document.getElementById('cat-list');
  const i = list.children.length;
  const div = document.createElement('div');
  div.className = 'st-row';
  div.innerHTML = `<input type="text" id="cat${i}" value="" placeholder="Category…"/><button class="st-del" onclick="this.parentElement.remove()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
  list.appendChild(div);
}
function removeCat(i) {
  const el = document.getElementById('cat' + i);
  if (el) el.closest('.st-row').remove();
}


function resetSettings() {
  if (!confirm('Reset owners and categories to defaults?')) return;
  localStorage.removeItem('travelSettings');
  applySettings();
  openSettings();
  toast('Settings reset to defaults');
  if (CT === 'packing_list') render();
}
function saveSettings() {
  const owners = [...document.getElementById('own-list').querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean);
  const cats   = [...document.getElementById('cat-list').querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean);
  saveSettingsData({ owners, categories: cats });
  applySettings();
  closeSettings();
  toast('Settings saved');
  if (CT === 'packing_list') render();
}
function closeSettings()         { document.getElementById('stt').classList.remove('on'); }
function bgCloseSettings(e)      { if (e.target === document.getElementById('stt')) closeSettings(); }

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('unlock-btn').addEventListener('click', function() { promptUnlock(); });
applySettings();
// settings button always visible via CSS

// If we have a stored trip, show the pill and load data; otherwise open selector
if (CURRENT_TRIP_ID) {
  // Attempt to resolve trip name from Supabase (async); show pill immediately
  document.getElementById('trip-pill-btn').style.display = 'inline-flex';
  sbGetTrips().then(trips => {
    allTrips = trips;
    const trip = trips.find(t => t.id === CURRENT_TRIP_ID);
    document.getElementById('trip-pill-name').textContent = trip ? trip.name : 'Trip';
  }).catch(() => {});
  loadTab();
} else {
  openTripSelector();
}
</script>
